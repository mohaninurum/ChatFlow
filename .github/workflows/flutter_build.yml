name: Chatflow Build

permissions:
  contents: write

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17 & Gradle Cache
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      # 4️⃣ Configure Gradle Mirrors (Fixes Maven Central 429 Too Many Requests)
      - name: Configure Gradle Mirrors
        run: |
          mkdir -p ~/.gradle
          cp android/init.gradle ~/.gradle/init.gradle

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6️⃣ Generate code using build_runner
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # 7️⃣ Build release APK
      - name: Build APK
        run: flutter build apk --release

      # 8️⃣ Create GitHub Release
      - name: Create Release & Upload APK
        uses: ncipollo/release-action@v1
        with:
         tag: v${{ github.run_number }}
         name: Chatflow Release v${{ github.run_number }}
         body: "Automated APK build from GitHub Actions for Chatflow"
         allowUpdates: true
         artifacts: build/app/outputs/flutter-apk/app-release.apk
         token: ${{ secrets.GITHUB_TOKEN }}
